[package]
edition = "2024"
name = "xiao-nrf52480-embassy-blinky"
version = "0.1.0"
authors = ["Mariusz Jurgielewicz <mordor@mail.com>"]
resolver = "2"

[[bin]]
name = "xiao-nrf52480-embassy-blinky"
test = false
bench = false

[dependencies]
defmt = "1.1"
defmt-rtt = "1.2"
panic-probe = { version = "1.0", features = ["print-defmt"] }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-storage = "0.3.1"
cortex-m-rt = "0.7.5"

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
embassy-nrf = { version = "0.11", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }

# Only for examples/ble_scan.rs: the Nordic SoftDevice Controller (nrf-sdc/nrf-mpsl) and the trouble BLE host.
[dev-dependencies]
nrf-sdc = { version = "0.4", default-features = false, features = ["nrf52840", "multirole", "defmt"] }
nrf-mpsl = { version = "0.4", default-features = false, features = ["nrf52840", "defmt"] }
trouble = { package = "trouble-host", version = "0.8", default-features = false, features = ["defmt", "scan", "central", "peripheral", "default-packet-pool"] }
bt-hci = { version = "0.10", default-features = false, features = ["defmt"] }
embassy-futures = "0.1"
heapless = "0.9"
static_cell = "2"

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"
